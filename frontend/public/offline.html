<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Qodix Portal</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            opacity: 0.5;
            filter: grayscale(100%);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #C1FF72;
        }
        p {
            color: #888;
            max-width: 300px;
            line-height: 1.5;
        }
        .retry-btn {
            margin-top: 32px;
            background-color: rgba(193, 255, 114, 0.1);
            color: #C1FF72;
            border: 1px solid rgba(193, 255, 114, 0.3);
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <img src="/icons/icon-192.png" alt="Qodix" class="icon" />
    <h1>You're Offline</h1>
    <p>Qodix will reconnect automatically when your network is restored.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
